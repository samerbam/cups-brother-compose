services:
    cups:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ${CUPS_CONTAINER_NAME:-cups}
        restart: ${CUPS_RESTART_POLICY:-unless-stopped}
        ports:
            - "${CUPS_BIND_ADDRESS:-0.0.0.0}:${CUPS_PORT:-631}:631"
        devices:
            - "${CUPS_USB_PATH:-/dev/bus/usb}:/dev/bus/usb"
        environment:
            CUPSADMIN: ${CUPS_ADMIN_USER:-admin}
            CUPSPASSWORD: ${CUPS_PASSWORD:?Set CUPS_PASSWORD in .env}
            TZ: ${TIMEZONE:-Etc/UTC}
            CUPSBRPRINTER: ${CUPS_BR_PRINTER-DCP-T300}
        volumes:
            - "${CONFIG_PATH:-./config}:/etc/cups"
